# 腾讯云部署 Nginx 配置
# 说明：测试环境启用 HTTPS(443)，HTTP(80) 强制跳转；
#       生产环境当前 /etc/nginx/ssl/ 下无 fazhihui.meichuangmenye.com 证书，
#       故生产环境暂只保留 HTTP(80) 反代，待补齐证书后再启用 443。
#       测试环境后端 3000，生产环境后端 3001。

# ==================== 测试环境 ====================
server {
    listen 80;
    server_name test.meichuangmenye.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name test.meichuangmenye.com;

    ssl_certificate     /etc/nginx/ssl/test.meichuangmenye.com.crt;
    ssl_certificate_key /etc/nginx/ssl/test.meichuangmenye.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /home/ubuntu/fazhihui/frontend/dist-test;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    client_max_body_size 20m;
}

# ==================== 生产环境（暂未配置 HTTPS 证书，先用 HTTP） ====================
server {
    listen 80;
    server_name fazhihui.meichuangmenye.com;

    root /home/ubuntu/fazhihui/frontend/dist-prod;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    client_max_body_size 20m;
}
