# 腾讯云部署 Nginx 配置
# Linux 部署路径: /etc/nginx/conf.d/fazhihui.conf
# Windows 部署路径: nginx安装目录/conf/nginx.conf (合并到http块内)
#
# 使用前需修改:
# 1. root 路径改为实际部署路径
# 2. SSL 证书路径改为实际路径（如启用HTTPS）
# 3. proxy_pass 端口确认与后端一致

# ==================== 测试环境 ====================
server {
    listen 80;
    server_name test.meichuangmenye.com;

    # 前端静态文件
    location / {
        root /home/ubuntu/fazhihui/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到测试后端 3000
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 上传文件大小限制
    client_max_body_size 20m;
}

# ==================== 生产环境 ====================
server {
    listen 80;
    server_name fazhihui.meichuangmenye.com;

    # 前端静态文件
    location / {
        root /home/ubuntu/fazhihui/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到生产后端 3001
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 上传文件大小限制
    client_max_body_size 20m;
}

